# OpenVALive VirtualAnalog - tests and the desktop apps.
#   push / pull request    tests, desktop apps as artifacts
#   Run workflow           with "release" ticked: the release vX.Y.Z of the VERSION file (tag + desktop apps)
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish the release vX.Y.Z of the VERSION file (tag + files), from this branch"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-numpy mingw-w64
      - name: fm1-base (fastmath.h, for the device checks)
        run: git clone --depth 1 https://github.com/charlesvestal/fm1-base "$HOME/fm1-base"
      - name: Tests
        run: FM1_BASE="$HOME/fm1-base" sh tests/run_tests.sh
      - name: Desktop apps
        run: |
          make desktop windows
          mkdir -p dist
          cp build/openvalive-desktop.exe dist/
          cp build/openvalive-desktop dist/openvalive-desktop-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: openvalive-desktop
          path: dist/
          retention-days: 14
      - name: Release (Actions > ci > Run workflow, "release" ticked)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(cat VERSION)"
          gh release create "v$V" dist/* --target "$GITHUB_SHA" --title "OpenVALive VirtualAnalog $V" \
            --notes "See CHANGELOG.md. The device firmwares: OpenVALive_FM-1, OpenVALive_SMK-37."
